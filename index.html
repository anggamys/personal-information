<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Moh Angga Yunus</title>
    <meta name="author" content="Moh Angga Yunus" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="images/favicon/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="stylesheet.css" />
  </head>
  <body>
    <!-- Language Switcher -->
    <div style="position: absolute; top: 15px; right: 20px; z-index: 100">
      <select id="langSwitcher" onchange="changeLanguage(this.value)" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-family: 'Lato', sans-serif">
        <option value="id">🇮🇩 Indonesia</option>
        <option value="en">🇬🇧 English</option>
      </select>
    </div>

    <table style="width: 100%; max-width: 800px; border: 0px; border-spacing: 0px; border-collapse: separate; margin-right: auto; margin-left: auto">
      <tbody>
        <tr style="padding: 0px">
          <td style="padding: 0px">
            <table style="width: 100%; border: 0px; border-spacing: 0px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody>
                <tr class="profile-row" style="padding: 0px">
                  <td class="profile-bio-col" style="padding: 2.5%; width: 63%; vertical-align: middle">
                    <p class="name" style="text-align: center" id="profile-name">Moh Angga Yunus</p>
                    <p id="profile-bio"></p>
                    <p style="text-align: center">
                      <a id="profile-email" href="#" target="_blank" rel="noopener noreferrer">Email</a> &nbsp;/&nbsp; <a id="profile-cv" href="#" target="_blank" rel="noopener noreferrer">CV</a> &nbsp;/&nbsp;
                      <a id="profile-bio-link" href="#" target="_blank" rel="noopener noreferrer">Bio</a> &nbsp;/&nbsp;
                      <a id="profile-linkedin" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a> &nbsp;/&nbsp;
                      <a id="profile-github" href="#" target="_blank" rel="noopener noreferrer">Github</a>
                    </p>
                  </td>
                  <td class="profile-photo-col" style="padding: 2.5%; width: 37%; max-width: 37%">
                    <a href="#"
                      ><img
                        id="profile-image"
                        alt="profile photo"
                        src="images/profile.webp"
                        class="hoverZoomLink"
                        style="width: 100%; max-width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center bottom; border-radius: 50%"
                    /></a>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- Experiences Section -->
            <table style="width: 100%; border: 0px; border-spacing: 0px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody>
                <tr>
                  <td style="padding: 16px; width: 100%; vertical-align: middle">
                    <h2 id="hdr-experiences">Experiences</h2>
                  </td>
                </tr>
              </tbody>
            </table>
            <table style="width: 100%; border: 0px; border-spacing: 0px 10px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody id="experiences-list"></tbody>
            </table>

            <!-- Publications Section -->
            <table style="width: 100%; border: 0px; border-spacing: 0px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody>
                <tr>
                  <td style="padding: 16px; width: 100%; vertical-align: middle">
                    <h2 id="hdr-publications">Publications</h2>
                  </td>
                </tr>
              </tbody>
            </table>
            <table style="width: 100%; border: 0px; border-spacing: 0px 10px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody id="publications-list"></tbody>
            </table>

            <!-- Projects Section -->
            <table style="width: 100%; border: 0px; border-spacing: 0px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody>
                <tr>
                  <td style="padding: 16px; width: 100%; vertical-align: middle">
                    <h2 id="hdr-projects">Projects & Activities</h2>
                  </td>
                </tr>
              </tbody>
            </table>
            <table style="width: 100%; border: 0px; border-spacing: 0px 10px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody id="projects-list"></tbody>
            </table>

            <!-- Achievements Section -->
            <table style="width: 100%; border: 0px; border-spacing: 0px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody>
                <tr>
                  <td style="padding: 16px; width: 100%; vertical-align: middle">
                    <h2 id="hdr-achievements">Achievements</h2>
                  </td>
                </tr>
              </tbody>
            </table>
            <table style="width: 100%; border: 0px; border-spacing: 0px 10px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody id="achievements-list"></tbody>
            </table>

            <table style="width: 100%; border: 0px; border-spacing: 0px; border-collapse: separate; margin-right: auto; margin-left: auto">
              <tbody>
                <tr>
                  <td style="padding: 0px">
                    <br />
                    <p id="txt-footer" style="text-align: right; font-size: small">Template dimodifikasi dari <a href="https://github.com/jonbarron/jonbarron_website">sumber asli Jon Barron</a>.</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Load data dynamically -->
    <script src="bibtex_parser.js"></script>
    <script src="locales/id.js"></script>
    <script src="locales/en.js"></script>
    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
